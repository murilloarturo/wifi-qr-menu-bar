name: WiFiQR
options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
targets:
  WiFiQR:
    type: application
    platform: macOS
    sources:
      - App
    settings:
      base:
        PRODUCT_NAME: WiFi QR
        PRODUCT_BUNDLE_IDENTIFIER: com.murilloarturo.wifiqr
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSLocationUsageDescription: WiFi QR reads the name of the Wi-Fi network you're on to find its password. macOS treats network names as location data.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: WiFi QR reads the name of the Wi-Fi network you're on to find its password. macOS treats network names as location data.
schemes:
  WiFiQR:
    build:
      targets:
        WiFiQR: all
    run:
      config: Debug
    archive:
      config: Release
